<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SwiftLogix — Intelligent Delivery Management System</title>
  
  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/orders.css" />
  <link rel="stylesheet" href="css/agents.css" />
  <link rel="stylesheet" href="css/assignment.css" />
</head>
<body>
  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar__header">
        <div class="brand">
          <div class="brand__logo">⚡</div>
          <div>
            <div class="brand__title">SwiftLogix</div>
            <div class="brand__subtitle">Intelligent Dispatch</div>
          </div>
        </div>
      </div>

      <nav class="nav-menu">
        <ul>
          <li class="nav-item">
            <button type="button" class="nav-link active" data-route="dashboard">
              <span class="nav-link__icon">📊</span>
              <span>Dashboard</span>
            </button>
          </li>
          <li class="nav-item">
            <button type="button" class="nav-link" data-route="orders">
              <span class="nav-link__icon">📦</span>
              <span>Orders</span>
            </button>
          </li>
          <li class="nav-item">
            <button type="button" class="nav-link" data-route="agents">
              <span class="nav-link__icon">🚚</span>
              <span>Delivery Agents</span>
            </button>
          </li>
          <li class="nav-item">
            <button type="button" class="nav-link" data-route="assignment">
              <span class="nav-link__icon">⚡</span>
              <span>Smart Assignment</span>
              <span class="nav-badge nav-badge--highlight" id="nav-pending-badge" style="display: none;">0</span>
            </button>
          </li>
        </ul>
      </nav>

      <div class="sidebar__footer">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <div class="sidebar__status-pill">
            <span class="status-dot"></span> System Live (MVP)
          </div>
        </div>
        <button type="button" class="btn btn--secondary btn--sm" id="btn-reset-demo" style="width: 100%;">
          ↺ Reset Demo Data
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-wrapper">
      <!-- Top Bar -->
      <header class="top-bar">
        <div>
          <h1 class="top-bar__title" id="top-bar-title">Operations Dashboard</h1>
          <p class="top-bar__subtitle" id="top-bar-subtitle">Real-time overview of fleet and deliveries</p>
        </div>
      </header>

      <!-- Dynamic Page Views Container -->
      <div class="content-area">
        <section id="dashboard-view" class="page-view active" aria-label="Dashboard"></section>
        <section id="orders-view" class="page-view" aria-label="Orders"></section>
        <section id="agents-view" class="page-view" aria-label="Delivery Agents"></section>
        <section id="assignment-view" class="page-view" aria-label="Smart Assignment"></section>
      </div>
    </main>
  </div>

  <!-- Main ES Module Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
